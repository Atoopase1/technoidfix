  <script defer src="assets/js/app.js"></script>
  <style>
    .notfound-wrap {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      gap: 18px;
    }
    .notfound-code {
      font-size: clamp(5rem, 20vw, 8rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--brand), #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .notfound-icon {
      font-size: 3rem;
      color: var(--brand);
      opacity: .7;
    }
    .notfound-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--fg);
      margin: 0;
    }
    .notfound-desc {
      color: var(--muted);
      max-width: 360px;
      line-height: 1.6;
      margin: 0;
    }
    .notfound-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }
    .notfound-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: .95rem;
      text-decoration: none;
      transition: transform .15s, box-shadow .15s;
    }
    .notfound-btn:hover { transform: translateY(-2px); }
    .notfound-btn-primary {
      background: var(--brand);
      color: #fff;
      box-shadow: 0 4px 14px rgba(37,99,235,.3);
    }
    .notfound-btn-secondary {
      background: var(--card);
      color: var(--fg);
      border: 1.5px solid var(--border);
    }
  </style>
  <link rel="stylesheet" href="assets/css/motion.css" />
</head>
<body>
  <!-- Page Transition Loader -->
  <div id="tf-nav-loader" style="position:fixed;inset:0;z-index:9999999;background:#f8fafc;display:flex;align-items:center;justify-content:center;opacity:1;visibility:visible;transition:opacity .6s ease,visibility .6s ease;">
    <div style="position:relative;width:140px;height:140px;display:flex;align-items:center;justify-content:center;">
      <div style="position:absolute;top:50%;left:50%;width:100px;height:100px;margin:-50px 0 0 -50px;border-radius:50%;border:3px solid transparent;border-top-color:#0088CC;border-bottom-color:rgba(0,136,204,.15);animation:tfOS 1.4s linear infinite;"></div>
      <div style="position:absolute;top:50%;left:50%;width:126px;height:126px;margin:-63px 0 0 -63px;border-radius:50%;border:3px solid transparent;border-right-color:#F59E0B;border-left-color:rgba(245,158,11,.12);animation:tfOR 2.0s linear infinite;"></div>
      <img src="assets/icon-192.png" alt="" style="width:58px;height:58px;object-fit:contain;position:relative;z-index:2;animation:tfLP 1.6s cubic-bezier(.65,0,.35,1) infinite alternate;" />
    </div>
  </div>
  <style>
    @keyframes tfOS{to{transform:rotate(360deg)}}
    @keyframes tfOR{to{transform:rotate(-360deg)}}
    @keyframes tfLP{0%{transform:scale(.86);filter:drop-shadow(0 0 0 rgba(0,136,204,0))}100%{transform:scale(1.12);filter:drop-shadow(0 0 16px rgba(0,136,204,.5))}}
  </style>
  <script>
    /* Fix dark mode bg + hide loader after page loads */
    (function(){
      var l=document.getElementById('tf-nav-loader');
      if(l && localStorage.getItem('technoid-theme')==='dark') l.style.background='#0a0a0f';
      var shown=Date.now(), MIN=700, done=false;
      function hide(){
        if(done)return; done=true;
        var wait=Math.max(0,MIN-(Date.now()-shown));
        setTimeout(function(){
          var el=document.getElementById('tf-nav-loader');
          if(el){el.style.opacity='0';el.style.visibility='hidden';setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},650);}
        },wait);
      }
      if(document.readyState==='complete'){hide();}
      else{document.addEventListener('DOMContentLoaded',hide);window.addEventListener('load',hide);}
      setTimeout(hide,6000);
    })();
  </script>
  

  <!-- Nav injected by app.js via header.nav — replicate standard header -->
  <header class="nav" role="banner">
    <a href="index.html" class="brand-link" aria-label="Technoid home">
      <img src="assets/technoid.PNG" alt="TechnoidFix" class="brand-img"><span class="brand-text">Technoid<span style="color:var(--accent)">Fix</span></span>
    </a>
    <div class="nav-inline">
      <a href="index.html" data-page="home"><i class="fas fa-home"></i> Home</a>
      <a href="services.html" data-page="services"><i class="fas fa-folder-open"></i> Services</a>
      <a href="electrical-estimator/index.html" data-page="estimator"><i class="fas fa-bolt"></i> Estimator</a>
    </div>
    <nav role="navigation" aria-label="Main navigation">
      <a href="about.html" data-page="about"><i class="fas fa-user"></i> About</a>
      <a href="design.html" data-page="design"><i class="fas fa-palette nav-icon-mobile"></i> Design</a>
      <a href="web.html" data-page="web"><i class="fas fa-code nav-icon-mobile"></i> Web</a>
      <a href="contact.html" data-page="contact" class="nav-cta"><i class="fas fa-envelope nav-icon-mobile"></i> Contact</a>
      <a href="privacy.html" data-page="privacy"><i class="fas fa-shield-alt nav-icon-mobile"></i> Privacy</a>
      <a href="electrical-estimator/index.html" data-page="estimator" title="Free electrical wiring calculator"><i class="fas fa-bolt nav-icon-mobile"></i> Estimator</a>
      <hr class="nav-divider">
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode"><i class="fas fa-moon"></i></button>
    </nav>
    <button class="nav-hamburger" aria-label="Toggle menu" onclick="toggleNav()"><span></span><span></span><span></span></button>
  </header>

  <main>
    <div class="notfound-wrap">
      <div class="notfound-icon"><i class="fas fa-plug"></i></div>
      <div class="notfound-code">404</div>
      <h1 class="notfound-title">Page not found</h1>
      <p class="notfound-desc">
        Looks like this page got unplugged. The link may be broken or the page may have moved.
      </p>
      <div class="notfound-actions">
        <a href="index.html" class="notfound-btn notfound-btn-primary">
          <i class="fas fa-home"></i> Back to Home
        </a>
        <a href="contact.html" class="notfound-btn notfound-btn-secondary">
          <i class="fas fa-envelope"></i> Contact Us
        </a>
      </div>
    </div>
  </main>

  <!-- WhatsApp Floating Button -->
  <a href="https://wa.me/233544833571?text=Hi%20Technoid%2C%20I%27d%20like%20to%20enquire%20about%20your%20services." class="wa-float" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
    <i class="fab fa-whatsapp"></i>
    <span class="wa-float-label">Chat on WhatsApp</span>
  </a>

  <script defer src="assets/js/motion.js"></script>
</body>
</html>
